<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ปฏิทินบ้านเรา</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm home screen for parents, big and glowing
   IDEA: the living-room TV home screen, panels of glass over a warm evening light
   PICTURE: a huge clock and today's sheet, with the "tomorrow" alert as a glowing pill
   COLOUR and TYPE: deep wine-to-black ground, saffron for วันพระ, red holidays; Prompt for numbers, Sarabun for text
   LAYOUT: hero clock, alert, then panels (calendar, day, weather, add, looks), two columns on wide screens */
:root{--g1:#5a1420;--g2:#1a0b10;--g3:#0b0709;--glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.14);--edge:rgba(255,255,255,.16);--ink:#fff7f0;--mute:rgba(255,240,230,.68);--acc:#ff8a3d;--phra:#ffb02e;--hol:#ff5a5f;--bd:#3ddc97;--me:#6fb6ff;color-scheme:dark}
html[data-skin=temple]{--g1:#6b4a0e;--g2:#2a1b06;--g3:#120b03;--acc:#ffcf4a}
html[data-skin=sea]{--g1:#0e4a7a;--g2:#0a1d33;--g3:#050b14;--acc:#5ad1ff}
html[data-skin=forest]{--g1:#1f5a36;--g2:#0c2015;--g3:#050c08;--acc:#7be495}
html[data-skin=day]{--g1:#ffe2cf;--g2:#fff4ea;--g3:#fffaf5;--glass:rgba(255,255,255,.8);--glass2:#fff;--edge:rgba(120,60,30,.18);--ink:#2a1610;--mute:#7a5a4c;--acc:#d9480f;--phra:#c77700;--hol:#d32f2f;--bd:#1b8a5a;--me:#1f5fae;color-scheme:light}
html[data-skin=big]{--g1:#000;--g2:#000;--g3:#000;--glass:#111;--glass2:#222;--edge:#fff;--ink:#fff;--mute:#eee;--acc:#ffd400}
html[data-skin=big] body{font-size:24px}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;color:var(--ink);font:20px/1.5 Sarabun,system-ui,sans-serif;overflow-x:clip;background:radial-gradient(120% 70% at 15% 0%,var(--g1),transparent 60%),radial-gradient(90% 60% at 100% 100%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 60%),linear-gradient(var(--g2),var(--g3));background-attachment:fixed}
main{max-width:1100px;margin:auto;padding:18px 14px 70px;display:grid;gap:14px}
.panel{background:var(--glass);border:1px solid var(--edge);border-radius:26px;padding:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 40px rgba(0,0,0,.25)}
h2{font:500 24px/1.2 Prompt,sans-serif;margin:0 0 12px;color:var(--mute)}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:stretch}
.clock .hi{font:300 22px Prompt,sans-serif;color:var(--mute)}
.clock .t{font:300 clamp(84px,20vw,150px)/1 Prompt,sans-serif;letter-spacing:-2px;margin:6px 0}
.clock .dt{font:500 26px/1.3 Prompt,sans-serif}
.clock .be{color:var(--mute);font-size:20px}
.sheet{display:grid;place-items:center;text-align:center;background:linear-gradient(160deg,var(--glass2),var(--glass));position:relative;overflow:hidden}
.sheet::before{content:"";position:absolute;inset:0 0 auto;height:16px;background:var(--acc)}
.sheet .n{font:700 clamp(96px,22vw,140px)/1 Prompt,sans-serif;margin-top:10px}
.sheet .w{font:500 24px Prompt,sans-serif;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.chip{border-radius:999px;padding:6px 16px;font-weight:700;font-size:20px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.alert{display:grid;gap:8px}
.alert:empty{display:none}
.alert div{display:flex;align-items:center;gap:12px;border-radius:22px;padding:16px 20px;font:500 24px/1.35 Prompt,sans-serif;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 34%,transparent),color-mix(in srgb,var(--c) 10%,transparent));border:1px solid color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 0 30px color-mix(in srgb,var(--c) 25%,transparent)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.stack{display:grid;gap:14px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mhead b{font:500 26px Prompt,sans-serif}
button{font:inherit;font-weight:600;min-height:56px;min-width:56px;border-radius:16px;border:1px solid var(--edge);background:var(--glass2);color:var(--ink);cursor:pointer;padding:0 16px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{text-align:center;font-size:16px;color:var(--mute)}
.d{aspect-ratio:1;border-radius:50%;border:2px solid transparent;background:transparent;padding:0;min-height:0;min-width:0;font:500 22px Prompt,sans-serif;display:grid;place-items:center;position:relative}
.d.out{visibility:hidden}.d.sun{color:var(--hol)}
.d.phra{background:color-mix(in srgb,var(--phra) 85%,transparent);color:#1a0d00}
.d.hol{background:var(--hol);color:#fff}
.d.today{border-color:var(--ink)}
.d.sel{box-shadow:0 0 0 3px var(--acc)}
.d i{position:absolute;bottom:6%;width:8px;height:8px;border-radius:50%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:17px;color:var(--mute);margin-top:12px}
.legend span::before{content:"";display:inline-block;width:13px;height:13px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px;background:var(--c)}
.day h3{margin:0 0 10px;font:500 24px Prompt,sans-serif}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--edge)}
.row:first-of-type{border-top:0}
.row .chip{flex:1;text-align:start}
.del{font-size:18px;min-height:48px;color:var(--hol)}
.wx{display:grid;gap:10px}
.wx a{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:var(--glass2);border:1px solid var(--edge);border-radius:20px;padding:12px 16px;min-height:76px}
.wx em{font-style:normal;font-size:34px}
.wx b{display:block;font:500 22px Prompt,sans-serif}.wx span{font-size:17px;color:var(--mute)}
form{display:grid;gap:12px}
label{font-weight:600;display:grid;gap:6px}
input,select{font:inherit;font-size:22px;min-height:58px;border:1px solid var(--edge);border-radius:14px;padding:6px 14px;background:var(--glass2);color:var(--ink);width:100%}
select option{color:#000}
.chk{display:flex;align-items:center;gap:10px}.chk input{width:30px;height:30px;min-height:30px}
.go{background:var(--acc);color:#1a0a00;border:0;font:700 24px Prompt,sans-serif;min-height:64px}
.skins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.skins button{min-height:88px;display:grid;place-items:center;gap:6px;font-size:19px}
.skins i{width:64px;height:22px;border-radius:11px;background:var(--s);border:1px solid var(--edge)}
.skins button[aria-pressed=true]{outline:3px solid var(--acc)}
.note,.status{font-size:16px;color:var(--mute);margin:8px 0 0}
.now{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.now .ic{font-size:64px;line-height:1}
.now .tp{font:300 64px/1 Prompt,sans-serif}
.pm{background:var(--glass2);border:1px solid var(--edge);border-radius:18px;padding:12px 16px;margin-bottom:12px}
.pmh{display:flex;justify-content:space-between;align-items:baseline;font-size:22px}
.pmh span{font:500 30px Prompt,sans-serif}
.bar{position:relative;height:12px;border-radius:6px;margin:10px 0 4px;background:linear-gradient(90deg,#3ddc97 0 16%,#a8e05f 16% 25%,#ffd23f 25% 50%,#ff8a3d 50% 75%,#ff4d4d 75%)}
.bar i{position:absolute;top:-6px;width:6px;height:24px;border-radius:3px;background:var(--ink);left:0;transform:translateX(-50%);transition:left .6s}
.fc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.fc div{background:var(--glass2);border:1px solid var(--edge);border-radius:16px;padding:8px 4px;text-align:center;font-size:17px}
.fc b{display:block;font-size:30px;line-height:1.3}
.fc .r{color:var(--me)}
.add{padding:0}.add summary{list-style:none;cursor:pointer;font:500 24px Prompt,sans-serif;padding:16px 20px;min-height:64px;display:flex;align-items:center}.add summary::-webkit-details-marker{display:none}.add[open] summary{color:var(--mute)}.add form{padding:0 18px 18px}
.frame{padding:12px}
.ph{position:relative;height:clamp(240px,55vw,460px);border-radius:20px;overflow:hidden;background:var(--glass2);display:grid;place-items:center}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s}
.ph img.on{opacity:1}
.phbar{display:flex;gap:8px;margin-top:10px;align-items:center}
.phadd{flex:1;display:flex;align-items:center;justify-content:center;border-radius:16px;cursor:pointer;min-height:60px}
.phbar .del{min-height:60px}
@media(max-width:820px){.hero,.cols{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:no-preference){.alert div{animation:glow 2.4s ease-in-out infinite alternate}@keyframes glow{to{box-shadow:0 0 46px color-mix(in srgb,var(--c) 45%,transparent)}}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<main>
<section class="hero">
<div class="panel clock"><div class="hi" id="hi"></div><div class="t" id="clk"></div><div class="dt" id="dt"></div><div class="be" id="be"></div></div>
<div class="panel sheet" id="sheet"></div>
</section>
<section class="alert" id="alert" role="status"></section>
<section class="panel frame"><div class="ph" id="ph"><p class="note" id="phEmpty">ยังไม่มีรูป กด "เพิ่มรูป" เพื่อใส่รูปครอบครัว</p></div>
<div class="phbar"><button id="phPrev" aria-label="รูปก่อน">‹</button><label class="go phadd">＋ เพิ่มรูป<input id="phIn" type="file" accept="image/*" multiple hidden></label><button id="phDel" class="del">ลบรูปนี้</button><button id="phNext" aria-label="รูปถัดไป">›</button></div>
<p class="note" id="phSt"></p></section>
<section class="cols">
<div class="stack">
<div class="panel"><div class="mhead"><button id="prev" aria-label="เดือนก่อน">‹</button><b id="mtitle"></b><button id="next" aria-label="เดือนถัดไป">›</button></div>
<div class="grid" id="grid"></div>
<div class="legend"><span style="--c:var(--phra)">วันพระ</span><span style="--c:var(--hol)">วันหยุด</span><span style="--c:var(--bd)">วันเกิด</span><span style="--c:var(--me)">นัด/งาน</span></div></div>
<div class="panel day" id="day"></div>
</div>
<div class="stack">
<div class="panel"><h2>อากาศ <span id="place">ลพบุรี</span></h2>
<div class="now"><div class="ic" id="wIc">⛅</div><div><div class="tp" id="wT">--°</div><div id="wTx" class="note">กำลังโหลด…</div></div></div>
<div class="pm"><div class="pmh"><b>ฝุ่น PM2.5</b><span id="pmV">--</span></div><div class="bar"><i id="pmDot"></i></div><div id="pmTx" class="note"></div></div>
<div class="fc" id="fc"></div>
<div class="wx"><a href="https://www.thaiwater.net/" target="_blank" rel="noopener"><em>🌊</em><div><b>น้ำท่วม / ระดับน้ำ</b><span>สถานการณ์น้ำ · ThaiWater</span></div></a></div>
<p class="note" id="wUp"></p></div>
<details class="panel add" id="addBox"><summary>＋ เพิ่มวันสำคัญ</summary><form id="f">
<label>เรื่องอะไร<input id="ft" required maxlength="60" placeholder="เช่น วันเกิดแม่ / หมอนัด"></label>
<label>วันที่<input id="fd" type="date" required></label>
<label>ประเภท<select id="fk"><option value="bd">วันเกิด</option><option value="ev" selected>นัด / งาน</option></select></label>
<label class="chk"><input id="fy" type="checkbox">เป็นทุกปี (เช่น วันเกิด)</label>
<label id="pinRow">รหัสครอบครัว (ใส่ครั้งแรกครั้งเดียว)<input id="fp" inputmode="numeric" autocomplete="off"></label>
<button class="go" type="submit">บันทึก</button>
<p class="status" id="st"></p></form></details>
</div>
</section>
<section class="panel"><h2>เลือกหน้าตา</h2><div class="skins" id="skins">
<button data-s="" style="--s:linear-gradient(90deg,#5a1420,#ff8a3d)"><i></i>ค่ำคืน</button>
<button data-s="temple" style="--s:linear-gradient(90deg,#6b4a0e,#ffcf4a)"><i></i>ทองวัด</button>
<button data-s="sea" style="--s:linear-gradient(90deg,#0e4a7a,#5ad1ff)"><i></i>ฟ้าคราม</button>
<button data-s="forest" style="--s:linear-gradient(90deg,#1f5a36,#7be495)"><i></i>เขียวป่า</button>
<button data-s="day" style="--s:linear-gradient(90deg,#fff4ea,#d9480f)"><i></i>สว่าง</button>
<button data-s="big" style="--s:linear-gradient(90deg,#000 50%,#ffd400 50%)"><i></i>ตัวใหญ่ชัด</button>
</div><p class="note">แต่ละเครื่องเลือกหน้าตาของตัวเองได้ · วันพระและวันหยุดราชการใส่ไว้ถึงสิ้นปี 2570 อ้างอิงปฏิทินทั่วไป</p></section>
</main>
<script>
{
const TH_M=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const TH_D=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
const PHRA={2026:{11:[3,9,17,24],12:[2,9,17,24]},2027:{1:[1,7,15,22,30],2:[6,14,21],3:[1,7,15,22,30],4:[6,14,21,29],5:[5,13,20,28],6:[4,12,19,27],7:[3,11,18,26],8:[2,10,17,25,31],9:[8,15,23,30],10:[8,15,23,29],11:[6,13,21,28],12:[6,13,21,27]}};
const HOL={"2026-12-05":"วันพ่อแห่งชาติ","2026-12-07":"ชดเชยวันพ่อแห่งชาติ","2026-12-10":"วันรัฐธรรมนูญ","2026-12-31":"วันสิ้นปี","2027-01-01":"วันขึ้นปีใหม่","2027-02-21":"วันมาฆบูชา","2027-02-22":"ชดเชยวันมาฆบูชา","2027-04-06":"วันจักรี","2027-04-13":"วันสงกรานต์","2027-04-14":"วันสงกรานต์","2027-04-15":"วันสงกรานต์","2027-05-01":"วันแรงงาน","2027-05-03":"ชดเชยวันแรงงาน","2027-05-04":"วันฉัตรมงคล","2027-05-20":"วันวิสาขบูชา","2027-06-03":"วันเฉลิมฯ พระราชินี","2027-07-18":"วันอาสาฬหบูชา","2027-07-19":"วันเข้าพรรษา","2027-07-28":"วันเฉลิมฯ ในหลวง ร.10","2027-08-12":"วันแม่แห่งชาติ","2027-10-13":"วันคล้ายวันสวรรคต ร.9","2027-10-15":"วันออกพรรษา","2027-10-23":"วันปิยมหาราช","2027-10-25":"ชดเชยวันปิยมหาราช","2027-12-05":"วันพ่อแห่งชาติ","2027-12-06":"ชดเชยวันพ่อแห่งชาติ","2027-12-10":"วันรัฐธรรมนูญ","2027-12-31":"วันสิ้นปี"};
const COL={phra:"var(--phra)",hol:"var(--hol)",bd:"var(--bd)",ev:"var(--me)",dust:"#ff8a3d",rain:"var(--me)",hot:"#ff4d4d"};
// ===== ตำแหน่งบ้าน (ลพบุรี) แก้ได้ =====
const LAT=14.7995,LON=100.6534,PLACE="ลพบุรี";
const CFG=window.BAANRAO||{};const sb=(window.supabase&&CFG.url)?window.supabase.createClient(CFG.url,CFG.key):null;const FN=(CFG.url||"")+"/functions/v1/photo";
let wxAlerts=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const isPhra=d=>(PHRA[d.getFullYear()]?.[d.getMonth()+1]||[]).includes(d.getDate());
const now=()=>new Date();
let events=[],view=new Date(),sel=new Date();view.setDate(1);
function eventsOn(d){const k=key(d),md=k.slice(5),y=d.getFullYear(),leap=(y%4===0&&y%100!==0)||y%400===0;return events.filter(e=>{if(e.date===k)return true;if(!e.yearly)return false;let m=String(e.date).slice(5);if(m==="02-29"&&!leap)m="02-28";return m===md})}
function tagsFor(d){const t=[];if(isPhra(d))t.push(["phra","วันพระ"]);const h=HOL[key(d)];if(h)t.push(["hol",h]);
 for(const e of eventsOn(d)){let x=e.title;if(e.kind==="bd"&&e.yearly){const y=d.getFullYear()-Number(String(e.date).slice(0,4));if(y>0)x+=" (ครบ "+y+" ปี)"}t.push([e.kind==="bd"?"bd":"ev",x,e.id])}return t}
const thDate=d=>"วัน"+TH_D[d.getDay()]+"ที่ "+d.getDate()+" "+TH_M[d.getMonth()]+" "+(d.getFullYear()+543);
const chip=x=>'<span class="chip" style="--c:'+COL[x[0]]+'">'+esc(x[1])+"</span>";
function renderClock(){const d=now(),h=d.getHours();$("hi").textContent=h<11?"สวัสดีตอนเช้า":h<13?"สวัสดีตอนเที่ยง":h<17?"สวัสดีตอนบ่าย":h<19?"สวัสดีตอนเย็น":"สวัสดีตอนค่ำ";
 $("clk").textContent=pad(h)+":"+pad(d.getMinutes());$("dt").textContent="วัน"+TH_D[d.getDay()]+"ที่ "+d.getDate()+" "+TH_M[d.getMonth()];$("be").textContent="พ.ศ. "+(d.getFullYear()+543)}
function renderSheet(){const d=now(),t=tagsFor(d);
 $("sheet").innerHTML='<div><div class="w">'+TH_M[d.getMonth()]+'</div><div class="n">'+d.getDate()+'</div><div class="w">วัน'+TH_D[d.getDay()]+'</div><div class="chips">'+(t.length?t.map(chip).join(""):'<span class="chip" style="--c:var(--mute)">วันนี้ไม่มีนัด</span>')+"</div></div>";
 const a=[];
 for(const x of t){if(x[0]==="phra")a.push(["phra","🙏 วันนี้วันพระ"]);else if(x[0]==="hol")a.push(["hol","🏖️ วันนี้วันหยุดราชการ: "+esc(x[1])]);else if(x[0]==="bd")a.push(["bd","🎂 วันนี้วันเกิด "+esc(x[1])]);else a.push(["ev","📌 วันนี้มีนัด: "+esc(x[1])])}
 const tm=new Date(d);tm.setDate(d.getDate()+1);
 for(const x of tagsFor(tm)){if(x[0]==="phra")a.push(["phra","🙏 พรุ่งนี้วันพระ เตรียมชุดไว้วันนี้เลย"]);else if(x[0]==="hol")a.push(["hol","พรุ่งนี้วันหยุดราชการ: "+esc(x[1])]);else if(x[0]==="bd")a.push(["bd","พรุ่งนี้วันเกิด "+esc(x[1])+" 🎂"]);else a.push(["ev","พรุ่งนี้มีนัด: "+esc(x[1])])}
 a.push(...wxAlerts);
 $("alert").innerHTML=a.map(x=>'<div style="--c:'+COL[x[0]]+'">'+x[1]+"</div>").join("")}
function renderMonth(){const y=view.getFullYear(),m=view.getMonth();$("mtitle").textContent=TH_M[m]+" "+(y+543);
 const first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let h=["อา","จ","อ","พ","พฤ","ศ","ส"].map(x=>'<div class="dow">'+x+"</div>").join("");
 for(let i=0;i<first;i++)h+='<div class="d out"></div>';
 for(let i=1;i<=n;i++){const d=new Date(y,m,i),c=["d"];if(d.getDay()===0)c.push("sun");if(isPhra(d))c.push("phra");if(HOL[key(d)])c.push("hol");if(key(d)===key(now()))c.push("today");if(key(d)===key(sel))c.push("sel");
  const ev=eventsOn(d);const dot=ev.length?'<i style="--c:'+(ev.some(e=>e.kind==="bd")?"var(--bd)":"var(--me)")+'"></i>':"";
  h+='<button class="'+c.join(" ")+'" data-k="'+key(d)+'" aria-label="'+thDate(d)+'">'+i+dot+"</button>"}
 $("grid").innerHTML=h;renderDay()}
function renderDay(){const t=tagsFor(sel);$("day").innerHTML="<h3>"+thDate(sel)+"</h3>"+(t.length?t.map(x=>'<div class="row">'+chip(x)+(x[2]?'<button class="del" data-id="'+esc(x[2])+'">ลบ</button>':"")+"</div>").join(""):'<p class="note">ไม่มีอะไรในวันนี้ · แตะวันในปฏิทินเพื่อดู</p>')}
function renderAll(){renderClock();renderSheet();renderMonth()}
$("prev").onclick=()=>{view.setMonth(view.getMonth()-1);renderMonth()};
$("next").onclick=()=>{view.setMonth(view.getMonth()+1);renderMonth()};
$("grid").onclick=e=>{const b=e.target.closest("button[data-k]");if(!b)return;const[y,m,d]=b.dataset.k.split("-").map(Number);sel=new Date(y,m-1,d);$("fd").value=b.dataset.k;renderMonth()};
function getPin(){let p=$("fp").value.trim();if(!p){try{p=localStorage.getItem("fpin")||""}catch(e){}}return p}
const ERR={bad_pin:"รหัสครอบครัวไม่ถูกต้อง",locked:"ใส่รหัสผิดหลายครั้ง รอ 15 นาทีแล้วลองใหม่",pin_not_set:"ยังไม่ได้ตั้งรหัสครอบครัว",invalid_input:"ข้อมูลไม่ครบหรือวันที่ไม่ถูกต้อง"};
function pinFail(code){if(code==="bad_pin"){try{localStorage.removeItem("fpin")}catch(e){}$("pinRow").hidden=false;$("addBox").open=true}}
function pinGood(){try{localStorage.setItem("fpin",getPin())}catch(e){}$("pinRow").hidden=true;$("fp").value=""}
async function rpc(fn,args){if(!sb)throw new Error("เชื่อมต่อไม่ได้");const{data,error}=await sb.rpc(fn,{p_pin:getPin(),...args});if(error)throw new Error("ระบบขัดข้อง");if(data&&data.error){pinFail(data.error);throw new Error(ERR[data.error]||"ผิดพลาด")}pinGood();return data}
$("day").onclick=async e=>{const b=e.target.closest(".del");if(!b)return;
 if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="กดอีกครั้งเพื่อลบ";setTimeout(()=>{b.dataset.ok="";b.textContent="ลบ"},4000);return}
 try{await rpc("delete_event",{p_id:Number(b.dataset.id)});await loadEvents()}catch(err){$("st").textContent="ลบไม่ได้: "+err.message}};
$("fk").onchange=()=>{if($("fk").value==="bd")$("fy").checked=true};
$("fd").value=key(now());
$("f").onsubmit=async e=>{e.preventDefault();
 const o={title:$("ft").value.trim(),date:$("fd").value,kind:$("fk").value,yearly:$("fy").checked};if(!o.title||!o.date)return;
 $("st").textContent="กำลังบันทึก…";
 try{await rpc("add_event",{p_title:o.title,p_date:o.date,p_kind:o.kind,p_yearly:o.yearly});$("st").textContent="บันทึกแล้ว ✓";$("addBox").open=false;$("ft").value="";const[y,m,d]=o.date.split("-").map(Number);sel=new Date(y,m-1,d);view=new Date(y,m-1,1);await loadEvents()}
 catch(err){$("st").textContent="บันทึกไม่ได้: "+err.message}};
try{if(localStorage.getItem("fpin"))$("pinRow").hidden=true}catch(e){}
const setSkin=s=>{if(s)document.documentElement.dataset.skin=s;else delete document.documentElement.dataset.skin;for(const b of $("skins").children)b.setAttribute("aria-pressed",String(b.dataset.s===s));try{localStorage.setItem("skin2",s)}catch(e){}};
$("skins").onclick=e=>{const b=e.target.closest("button");if(b)setSkin(b.dataset.s)};
let sk="";try{sk=localStorage.getItem("skin2")||""}catch(e){}setSkin(sk);
renderAll();
async function loadEvents(){try{if(!sb)throw 0;const{data,error}=await sb.from("family_events").select("id,title,event_date,kind,yearly");if(error)throw error;events=(data||[]).map(e=>({id:String(e.id),title:e.title,date:e.event_date,kind:e.kind,yearly:e.yearly}));$("st").textContent=""}catch(e){$("st").textContent="โหลดนัดไม่ได้ ยังดูวันพระ/วันหยุดได้ตามปกติ"}renderAll()}
// ===== อากาศ + ฝุ่น จาก Open-Meteo (ฟรี ไม่ต้องใช้ key) =====
const WMO=c=>c===0?["☀️","ฟ้าใส"]:c<=2?["🌤️","มีเมฆบางส่วน"]:c===3?["☁️","เมฆมาก"]:c<=48?["🌫️","มีหมอก"]:c<=57?["🌦️","ฝนปรอยๆ"]:c<=67?["🌧️","ฝนตก"]:c<=82?["🌧️","ฝนตกเป็นช่วง"]:["⛈️","พายุฝนฟ้าคะนอง"];
const pmLv=v=>v<=15?["ดีมาก","#3ddc97"]:v<=25?["ดี","#a8e05f"]:v<=37.5?["ปานกลาง","#ffd23f"]:v<=75?["เริ่มมีผลต่อสุขภาพ ควรใส่หน้ากาก","#ff8a3d"]:["มีผลต่อสุขภาพ งดอยู่กลางแจ้ง","#ff4d4d"];
async function loadWeather(){
 $("place").textContent=PLACE;const W=[];
 try{
  const f=await (await fetch("https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+"&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FBangkok&forecast_days=5")).json();
  const [ic,tx]=WMO(f.current.weather_code);$("wIc").textContent=ic;$("wT").textContent=Math.round(f.current.temperature_2m)+"°";
  const dl=f.daily;$("wTx").textContent=tx+" · สูงสุด "+Math.round(dl.temperature_2m_max[0])+"° ต่ำสุด "+Math.round(dl.temperature_2m_min[0])+"°";
  $("fc").innerHTML=[1,2,3,4].map(i=>{const d=new Date(dl.time[i]+"T00:00");const[c]=WMO(dl.weather_code[i]);return"<div>"+(i===1?"พรุ่งนี้":TH_D[d.getDay()])+"<b>"+c+"</b>"+Math.round(dl.temperature_2m_max[i])+"° / "+Math.round(dl.temperature_2m_min[i])+'°<br><span class="r">ฝน '+(dl.precipitation_probability_max[i]??0)+"%</span></div>"}).join("");
  if((dl.precipitation_probability_max[0]??0)>=60)W.push(["rain","☔ วันนี้ฝนน่าจะตก พกร่มด้วยนะ"]);
  if((dl.precipitation_probability_max[1]??0)>=60)W.push(["rain","☔ พรุ่งนี้ฝนน่าจะตก เตรียมร่มไว้"]);
  if(dl.temperature_2m_max[0]>=38)W.push(["hot","🥵 วันนี้อากาศร้อนจัด ดื่มน้ำเยอะๆ"]);
  if(dl.temperature_2m_min[1]<=17)W.push(["rain","🧥 พรุ่งนี้เช้าอากาศหนาว เตรียมเสื้อกันหนาว"]);
 }catch(e){$("wTx").textContent="โหลดข้อมูลอากาศไม่ได้"}
 try{
  const a=await (await fetch("https://air-quality-api.open-meteo.com/v1/air-quality?latitude="+LAT+"&longitude="+LON+"&current=pm2_5&timezone=Asia%2FBangkok")).json();
  const v=Math.round(a.current.pm2_5);const[l,c]=pmLv(v);
  $("pmV").textContent=v+" µg/m³";$("pmV").style.color=c;$("pmTx").textContent=l;$("pmDot").style.left=Math.min(100,v/100*100)+"%";
  if(v>75)W.push(["hot","😷 ฝุ่น PM2.5 สูงมาก ("+v+") งดออกนอกบ้าน ใส่หน้ากาก"]);else if(v>37.5)W.push(["dust","😷 วันนี้ฝุ่นเยอะ ("+v+") ออกนอกบ้านใส่หน้ากากด้วย"]);
 }catch(e){$("pmTx").textContent="โหลดค่าฝุ่นไม่ได้"}
 wxAlerts=W;$("wUp").textContent="อัปเดต "+pad(now().getHours())+":"+pad(now().getMinutes())+" น. · ข้อมูลจาก Open-Meteo";renderSheet()}
// ===== รูปครอบครัว =====
let photos=[],pi=0;
async function loadPhotos(){try{if(!sb)throw 0;const{data,error}=await sb.storage.from("photos").list("",{limit:500,sortBy:{column:"name",order:"desc"}});if(error)throw error;photos=(data||[]).filter(f=>/\.jpg$/.test(f.name)).map(f=>sb.storage.from("photos").getPublicUrl(f.name).data.publicUrl)}catch(e){photos=[]}if(pi>=photos.length)pi=0;showPhoto()}
function showPhoto(){const box=$("ph");$("phEmpty").hidden=photos.length>0;$("phDel").hidden=!photos.length;
 const old=box.querySelector("img.on");if(!photos.length){if(old)old.remove();return}
 const im=new Image();im.alt="รูปครอบครัว";im.src=String(photos[pi]);im.onload=()=>{box.appendChild(im);requestAnimationFrame(()=>im.classList.add("on"));if(old){old.classList.remove("on");setTimeout(()=>old.remove(),1300)}}}
const step=n=>{if(!photos.length)return;pi=(pi+n+photos.length)%photos.length;showPhoto()};
$("phPrev").onclick=()=>step(-1);$("phNext").onclick=()=>step(1);
setInterval(()=>step(1),8000);
function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),"image/jpeg",0.85)};im.onerror=no;im.src=u})}
async function photoPost(body){const isForm=body instanceof FormData;if(isForm)body.append("pin",getPin());const r=await fetch(FN,{method:"POST",headers:{apikey:CFG.key,...(isForm?{}:{"Content-Type":"application/json"})},body:isForm?body:JSON.stringify({...body,pin:getPin()})});const j=await r.json().catch(()=>({}));if(!r.ok){pinFail(j.code);throw new Error(j.error||"ผิดพลาด")}pinGood();return j}
$("phIn").onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;if(!getPin()){$("phSt").textContent="ใส่รหัสครอบครัวในเมนู เพิ่มวันสำคัญ ก่อนนะ";$("addBox").open=true;return}
 let n=0;for(const f of fs){$("phSt").textContent="กำลังอัปโหลด "+(n+1)+"/"+fs.length+"…";try{const fd=new FormData();fd.append("photo",await shrink(f),"p.jpg");await photoPost(fd);n++}catch(err){$("phSt").textContent="อัปโหลดไม่ได้: "+(err.message||"ไฟล์นี้ใช้ไม่ได้")}}
 e.target.value="";if(n)$("phSt").textContent="เพิ่มรูปแล้ว "+n+" รูป ✓";pi=0;await loadPhotos()};
$("phDel").onclick=async()=>{const b=$("phDel");if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="กดอีกครั้งเพื่อลบ";setTimeout(()=>{b.dataset.ok="";b.textContent="ลบรูปนี้"},4000);return}
 b.dataset.ok="";b.textContent="ลบรูปนี้";try{await photoPost({action:"delete",path:String(photos[pi]).split("/").pop().split("?")[0]});await loadPhotos()}catch(err){$("phSt").textContent="ลบไม่ได้: "+err.message}};
loadPhotos();setInterval(loadPhotos,5*60000);
loadEvents();loadWeather();
let lastDay=key(now());
setInterval(()=>{renderClock();if(key(now())!==lastDay){lastDay=key(now());renderAll()}},20000);
if(sb)sb.channel("events").on("postgres_changes",{event:"*",schema:"public",table:"family_events"},()=>loadEvents()).subscribe();setInterval(loadWeather,30*60000);
}
</script>
